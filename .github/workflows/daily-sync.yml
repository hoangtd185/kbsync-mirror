name: daily-sync

on:
  schedule:
    - cron: "17 2 * * *" # once a day, 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t kbsync .

      - name: Scrape and upload delta
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p runs articles && chmod 777 runs articles
          set -o pipefail
          docker run --rm -e GEMINI_API_KEY \
            -v "$PWD/runs:/app/runs" -v "$PWD/articles:/app/articles" \
            kbsync 2>&1 | tee runs/job.log

      - name: Summary
        if: always()
        run: |
          if [ -f runs/last_run.json ]; then
            {
              echo "### Knowledge base sync"
              echo '```json'
              cat runs/last_run.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload run artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: |
            runs/
            articles/
          retention-days: 30
